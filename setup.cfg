[flake8]
# Repo-root dev config (not packaged into the plugin ZIP).
# max-line-length is generous to match the existing codebase; the QGIS
# validator reported no E501. E203/W503/W504 are the black-compatible rules
# that conflict with each other or with PEP 8's current recommendation.
max-line-length = 200
extend-ignore = E203, W503, W504
exclude = .git,__pycache__,docs,reference,papers
